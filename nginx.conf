server {
    listen 80;
    server_name angeliquerobin.com;
    return 301 https://www.angeliquerobin.com$request_uri;
}

server {
    listen 80;
    server_name www.angeliquerobin.com _;
    root /usr/share/nginx/html;
    index accueil.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|css|js|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
